name: VHS FEVER scrape proof of concept

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scrape-poc.yml'
      - 'scripts/discover_vhsvault.py'
      - 'scripts/discover_vhsvault_candidates.py'
      - 'scripts/inspect_file_inventory.py'
      - 'scripts/build_program_catalog.py'\n      - 'scripts/enrich_program_tmdb.py'
      - 'scripts/build_program_candidates.py'
      - 'scripts/build_title_groups.py'
      - 'scripts/build_final_catalog.py'
      - 'data/approved-decisions.json'
  workflow_dispatch:
    inputs:
      sample_size:
        description: "Number of Archive items whose file inventories to inspect"
        required: true
        default: "20"

permissions:
  contents: write

concurrency:
  group: vhs-fever-pages
  cancel-in-progress: false

jobs:
  scrape-poc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Discover popular VHS Vault movie candidates
        run: |
          mkdir -p data
          python scripts/discover_vhsvault_candidates.py \
            --rows 1000 \
            --page 1 \
            --output data/vhsvault-scrape-poc.jsonl

      - name: Classify discovered records using title metadata
        run: |
          python scripts/classify_catalog.py \
            --input data/vhsvault-scrape-poc.jsonl \
            --output data/vhsvault-scrape-poc-classified.jsonl

      - name: Inspect item file inventories without downloading media
        run: |
          python scripts/inspect_file_inventory.py \
            --input data/vhsvault-scrape-poc-classified.jsonl \
            --output data/vhsvault-scrape-poc-inventory.jsonl \
            --limit "${{ inputs.sample_size || '120' }}" \
            --delay 0.2

      - name: Match titles and collect artwork references
        env:
          TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
        run: |
          python scripts/enrich_metadata_artwork.py \
            --input data/vhsvault-scrape-poc-inventory.jsonl \
            --output data/vhsvault-scrape-poc-enriched.jsonl

      - name: Build individual program catalog from Archive file inventories
        run: |
          python scripts/build_program_catalog.py \
            --input data/vhsvault-scrape-poc-enriched.jsonl \
            --output data/vhsvault-program-catalog.jsonl \
            --review-output data/vhsvault-program-review-queue.jsonl

      - name: Suggest alternate-source title groups (review only)
        run: |
          python scripts/build_title_groups.py \
            --input data/vhsvault-program-catalog.jsonl \
            --output data/vhsvault-title-groups.jsonl

      - name: Build human-approved final catalog (approval required)
        run: |
          python scripts/build_final_catalog.py --candidates data/vhsvault-program-catalog-matched.jsonl --decisions data/approved-decisions.json --output data/vhsvault-final-catalog.jsonl

      - name: Validate scraped JSONL output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for name in (
              "data/vhsvault-scrape-poc.jsonl",
              "data/vhsvault-scrape-poc-classified.jsonl",
              "data/vhsvault-scrape-poc-inventory.jsonl",
              "data/vhsvault-scrape-poc-enriched.jsonl",
              "data/vhsvault-program-catalog.jsonl",
              "data/vhsvault-program-review-queue.jsonl",
              "data/vhsvault-title-groups.jsonl",
              "data/vhsvault-final-catalog.jsonl",
          ):
              path = Path(name)
              count = 0
              with path.open(encoding="utf-8") as stream:
                  for line_number, line in enumerate(stream, 1):
                      if not line.strip():
                          continue
                      value = json.loads(line)
                      if not isinstance(value, dict):
                          raise SystemExit(f"{name}:{line_number}: expected JSON object")
                      count += 1
              print(f"{name}: {count} valid records")
              if count == 0 and name not in {"data/vhsvault-program-review-queue.jsonl", "data/vhsvault-title-groups.jsonl", "data/vhsvault-final-catalog.jsonl"}:
                  raise SystemExit(f"{name}: no records were produced")
          PY


      - name: Prepare latest external catalog data
        run: |
          mkdir -p data/published
          cat data/vhsvault-scrape-poc-classified.jsonl data/vhsvault-scrape-poc-enriched.jsonl > data/published/latest.jsonl
          cp data/vhsvault-program-catalog-matched.jsonl data/published/programs.jsonl
          cp data/vhsvault-final-catalog.jsonl data/published/final-catalog.jsonl
          cp data/vhsvault-program-review-queue.jsonl data/published/program-review-queue.jsonl
          cp data/vhsvault-title-groups.jsonl data/published/title-groups.jsonl
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          manifest = {
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "commit": os.environ["GITHUB_SHA"],
              "classified_records": sum(1 for x in Path("data/vhsvault-scrape-poc-classified.jsonl").open() if x.strip()),
              "enriched_records": sum(1 for x in Path("data/vhsvault-scrape-poc-enriched.jsonl").open() if x.strip()),
              "program_entries": sum(1 for x in Path("data/vhsvault-program-catalog.jsonl").open() if x.strip()),
              "program_review_queue_entries": sum(1 for x in Path("data/vhsvault-program-review-queue.jsonl").open() if x.strip()),
              "suggested_title_groups": sum(1 for x in Path("data/vhsvault-title-groups.jsonl").open() if x.strip()),
              "human_approved_final_entries": sum(1 for x in Path("data/vhsvault-final-catalog.jsonl").open() if x.strip())
          }
          Path("data/published/latest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print(json.dumps(manifest, indent=2))
          PY

      - name: Publish catalog data independently
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: catalog-data
          publish_dir: ./data/published
          force_orphan: true
          enable_jekyll: false

      - name: Upload scrape proof-of-concept results
        uses: actions/upload-artifact@v4
        with:
          name: vhs-fever-scrape-poc
          path: |
            data/vhsvault-scrape-poc.jsonl
            data/vhsvault-scrape-poc.summary.json
            data/vhsvault-scrape-poc-classified.jsonl
            data/vhsvault-scrape-poc-classified.summary.json
            data/vhsvault-scrape-poc-inventory.jsonl
            data/vhsvault-scrape-poc-inventory.summary.json
            data/vhsvault-scrape-poc-enriched.jsonl
            data/vhsvault-scrape-poc-enriched.summary.json
            data/vhsvault-program-catalog.jsonl
            data/vhsvault-program-catalog.summary.json
            data/vhsvault-program-review-queue.jsonl
            data/vhsvault-title-groups.jsonl
          if-no-files-found: error
          retention-days: 14
