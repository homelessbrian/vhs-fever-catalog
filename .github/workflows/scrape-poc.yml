name: VHS FEVER scrape proof of concept

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scrape-poc.yml'
      - 'scripts/discover_vhsvault.py'
      - 'scripts/discover_vhsvault_candidates.py'
      - 'scripts/inspect_file_inventory.py'
  workflow_dispatch:
    inputs:
      sample_size:
        description: "Number of Archive items whose file inventories to inspect"
        required: true
        default: "20"

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: vhs-fever-pages
  cancel-in-progress: false

jobs:
  scrape-poc:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Discover popular VHS Vault movie candidates
        run: |
          mkdir -p data
          python scripts/discover_vhsvault_candidates.py \
            --rows 1000 \
            --page 1 \
            --output data/vhsvault-scrape-poc.jsonl

      - name: Classify discovered records using title metadata
        run: |
          python scripts/classify_catalog.py \
            --input data/vhsvault-scrape-poc.jsonl \
            --output data/vhsvault-scrape-poc-classified.jsonl

      - name: Inspect item file inventories without downloading media
        run: |
          python scripts/inspect_file_inventory.py \
            --input data/vhsvault-scrape-poc-classified.jsonl \
            --output data/vhsvault-scrape-poc-inventory.jsonl \
            --limit "${{ inputs.sample_size || '60' }}" \
            --delay 0.2

      - name: Match titles and collect artwork references
        env:
          TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
        run: |
          python scripts/enrich_metadata_artwork.py \
            --input data/vhsvault-scrape-poc-inventory.jsonl \
            --output data/vhsvault-scrape-poc-enriched.jsonl

      - name: Validate scraped JSONL output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for name in (
              "data/vhsvault-scrape-poc.jsonl",
              "data/vhsvault-scrape-poc-classified.jsonl",
              "data/vhsvault-scrape-poc-inventory.jsonl",
              "data/vhsvault-scrape-poc-enriched.jsonl",
          ):
              path = Path(name)
              count = 0
              with path.open(encoding="utf-8") as stream:
                  for line_number, line in enumerate(stream, 1):
                      if not line.strip():
                          continue
                      value = json.loads(line)
                      if not isinstance(value, dict):
                          raise SystemExit(f"{name}:{line_number}: expected JSON object")
                      count += 1
              print(f"{name}: {count} valid records")
              if count == 0:
                  raise SystemExit(f"{name}: no records were produced")
          PY


      - name: Prepare latest data for the reviewer
        run: |
          mkdir -p reviewer/data
          cp data/vhsvault-scrape-poc-classified.jsonl reviewer/data/latest-classified.jsonl
          cp data/vhsvault-scrape-poc-enriched.jsonl reviewer/data/latest-enriched.jsonl
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          manifest = {
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "commit": os.environ["GITHUB_SHA"],
              "classified_records": sum(1 for x in Path("reviewer/data/latest-classified.jsonl").open() if x.strip()),
              "enriched_records": sum(1 for x in Path("reviewer/data/latest-enriched.jsonl").open() if x.strip())
          }
          Path("reviewer/data/latest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print(json.dumps(manifest, indent=2))
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload reviewer site with latest data
        uses: actions/upload-pages-artifact@v3
        with:
          path: reviewer

      - name: Wait for Pages artifact to become visible to the Actions API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 18); do
            artifact_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts[] | select(.name == "github-pages") | .id' | head -n 1)
            if [ -n "$artifact_id" ]; then
              echo "Pages artifact is visible to the API (ID: $artifact_id)."
              exit 0
            fi
            echo "Pages artifact is not visible yet (attempt $attempt/18); waiting 5 seconds."
            sleep 5
          done
          echo "::error::Pages artifact did not become visible to the Actions API within 90 seconds."
          exit 1

      - name: Deploy reviewer site and latest data
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Upload scrape proof-of-concept results
        uses: actions/upload-artifact@v4
        with:
          name: vhs-fever-scrape-poc
          path: |
            data/vhsvault-scrape-poc.jsonl
            data/vhsvault-scrape-poc.summary.json
            data/vhsvault-scrape-poc-classified.jsonl
            data/vhsvault-scrape-poc-classified.summary.json
            data/vhsvault-scrape-poc-inventory.jsonl
            data/vhsvault-scrape-poc-inventory.summary.json
            data/vhsvault-scrape-poc-enriched.jsonl
            data/vhsvault-scrape-poc-enriched.summary.json
          if-no-files-found: error
          retention-days: 14
