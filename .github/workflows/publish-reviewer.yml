name: Publish VHS FEVER static reviewer

on:
  push:
    branches: [main]
    paths:
      - 'reviewer/**'
      - '.github/workflows/publish-reviewer.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vhs-fever-static-site
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Publish static reviewer only
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./reviewer
          force_orphan: true
          enable_jekyll: false
