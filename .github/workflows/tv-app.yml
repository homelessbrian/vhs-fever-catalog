name: Build TV app (Android TV)

on:
  push:
    branches: [main, rebuild/data-model]
    paths:
      - 'tv/**'
      - '.github/workflows/tv-app.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Test and build
        working-directory: tv
        env:
          TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
        run: gradle --no-daemon testDebugUnitTest assembleRelease
      - name: Name the app file
        run: cp tv/app/build/outputs/apk/release/app-release.apk vhs-fever-tv.apk
      - uses: actions/upload-artifact@v4
        with:
          name: vhs-fever-tv-${{ github.run_number }}
          path: vhs-fever-tv.apk
          retention-days: 30
      # A fixed download link for the TV (e.g. in the Downloader app):
      # https://github.com/homelessbrian/vhs-fever-catalog/releases/download/tv-latest/vhs-fever-tv.apk
      - name: Publish to the tv-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view tv-latest >/dev/null 2>&1 || \
            gh release create tv-latest --prerelease --target "${{ github.sha }}" \
              --title "VHS FEVER TV (latest test build)" \
              --notes "Proof-of-concept TV app for testing playback. Install vhs-fever-tv.apk on the TV."
          gh release upload tv-latest vhs-fever-tv.apk --clobber
          gh release edit tv-latest --notes "Proof-of-concept TV app for testing playback. Build ${{ github.run_number }} from ${{ github.ref_name }} (${{ github.sha }})."
