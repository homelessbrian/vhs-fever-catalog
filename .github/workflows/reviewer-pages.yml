name: Publish VHS FEVER Research Desk

on:
  push:
    branches: [main]
    paths:
      - 'reviewer/**'
      - '.github/workflows/reviewer-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: reviewer
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
