# This copy lives on main only so GitHub runs it on a schedule (GitHub only
# runs scheduled jobs from main). It always works on the rebuild/data-model
# branch's scripts and data.
name: Auto-sort files and find new Archive uploads

# Gives every video file a best guess (kind, VHS/DVD/Blu-ray/TV, good/bad/
# review, built-in commercials, artwork) and checks those guesses against the
# files already reviewed in the app. Also lists new VHS Vault uploads the
# catalog hasn't seen yet, and VHS-era uploads found outside the Vault
# (through Vault uploaders, tape keywords and TV/commercial collections).
# Results go to the auto-sort-data branch. Nothing is
# approved automatically and no review decision is changed.

on:
  workflow_run:
    workflows: ["Check files for sound and picture"]
    types: [completed]
  schedule:
    - cron: "41 9 * * *"
  workflow_dispatch:
    inputs:
      backfill_pages:
        description: "Pages of older Archive uploads to list this run (200 items a page)"
        required: false
        default: "10"
      more_pages:
        description: "Search pages to read outside the VHS Vault this run (200 items a page)"
        required: false
        default: "60"

permissions:
  contents: write

concurrency:
  group: vhs-fever-auto-sort
  cancel-in-progress: false

jobs:
  sort:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/data-model
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest tests.test_auto_sort tests.test_title_search tests.test_discover_more_items -v

      - name: Get catalog, sound checks, your reviews and the earlier new-items list
        env:
          RAW: https://raw.githubusercontent.com/${{ github.repository }}
        run: |
          mkdir -p work/model out
          for f in recordings archive-items artwork titles; do
            curl -fsSL "$RAW/catalog-model-data/$f.jsonl" -o "work/model/$f.jsonl"
          done
          curl -fsSL "$RAW/audio-data/audio-checks.jsonl" -o work/audio-checks.jsonl || touch work/audio-checks.jsonl
          curl -fsSL "$RAW/review-data/review/decisions.json" -o work/decisions.json || echo '{}' > work/decisions.json
          curl -fsSL "$RAW/auto-sort-data/new-items.jsonl" -o work/new-items.jsonl || touch work/new-items.jsonl
          curl -fsSL "$RAW/auto-sort-data/more-items.jsonl" -o work/more-items.jsonl || touch work/more-items.jsonl
          curl -fsSL "$RAW/auto-sort-data/more-sources-state.json" -o work/more-sources-state.json || echo '{}' > work/more-sources-state.json

      # Who uploaded which Vault page. Kept only in this private cache, never
      # published, so nobody's e-mail address ends up in the repository.
      - name: Restore looked-up Vault uploaders
        uses: actions/cache@v4
        with:
          path: work/private
          key: vault-uploaders-${{ github.run_id }}
          restore-keys: vault-uploaders-

      - name: Find new VHS Vault uploads
        continue-on-error: true
        run: |
          python scripts/discover_new_items.py \
            --known work/new-items.jsonl \
            --catalog-items work/model/archive-items.jsonl \
            --backfill-pages "${{ inputs.backfill_pages || '10' }}" \
            --output-dir out

      - name: Keep the earlier list if the Archive search failed
        run: |
          if [ ! -s out/new-items.jsonl ] && [ -s work/new-items.jsonl ]; then cp work/new-items.jsonl out/; fi

      - name: Find more uploads outside the VHS Vault
        continue-on-error: true
        run: |
          python scripts/discover_more_items.py \
            --known work/more-items.jsonl \
            --state work/more-sources-state.json \
            --uploader-cache work/private/uploaders.json \
            --vault-items out/new-items.jsonl \
            --catalog-items work/model/archive-items.jsonl \
            --max-pages "${{ inputs.more_pages || '60' }}" \
            --output-dir out

      - name: Keep the earlier outside list if that search failed
        run: |
          if [ ! -s out/more-items.jsonl ] && [ -s work/more-items.jsonl ]; then
            cp work/more-items.jsonl out/
            cp work/more-sources-state.json out/ 2>/dev/null || true
          fi

      - name: Auto-sort every file
        run: |
          python scripts/auto_sort.py --model-dir work/model \
            --audio work/audio-checks.jsonl --output-dir out

      - name: Check against your reviews
        run: |
          python scripts/evaluate_auto_sort.py --auto-sort out/auto-sort.jsonl \
            --decisions work/decisions.json --output-dir out
          cat out/accuracy.md >> "$GITHUB_STEP_SUMMARY"
          {
            echo; echo '## Auto-sort totals'; echo '```'; cat out/auto-sort.summary.json; echo '```'
            if [ -f out/new-items.summary.json ]; then
              echo '## New Archive uploads'; echo '```'; cat out/new-items.summary.json; echo '```'
            fi
            if [ -f out/more-items.summary.json ]; then
              echo '## Found outside the VHS Vault'; echo '```'; cat out/more-items.summary.json; echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          touch out/.nojekyll

      - name: Publish to auto-sort-data
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: auto-sort-data
          publish_dir: ./out
          force_orphan: true
          enable_jekyll: false
          commit_message: "Auto-sort from ${{ github.sha }}"
