name: VHS Vault file inventory pilot

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/file-inventory-pilot.yml'
      - 'docs/program-assembly.md'
      - 'docs/metadata-artwork.md'
  workflow_dispatch:
    inputs:
      sample_size:
        description: "Number of items to inspect (pilot limit 500)"
        required: true
        default: "120"

permissions:
  contents: read
  actions: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download latest classified catalog artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          CLASSIFY_RUN_ID="$(gh run list --repo "${{ github.repository }}" --workflow classify-catalog.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$CLASSIFY_RUN_ID"
          echo "Using latest successful classification run: $CLASSIFY_RUN_ID"
          gh run download "$CLASSIFY_RUN_ID" --repo "${{ github.repository }}" \
            --name vhs-fever-classified-catalog --dir data

      - name: Inspect a balanced sample of Archive file inventories
        run: |
          python scripts/inspect_file_inventory.py \
            --input data/vhsvault-classified.jsonl \
            --output data/vhsvault-file-inventory-pilot.jsonl \
            --limit "${{ inputs.sample_size || '120' }}" \
            --delay 0.5

      - name: Build sequential program candidates
        run: |
          python scripts/build_program_candidates.py \
            --input data/vhsvault-file-inventory-pilot.jsonl \
            --output data/vhsvault-program-candidates.jsonl

      - name: Build standalone and assembled program catalog
        run: |
          python scripts/build_program_catalog.py --input data/vhsvault-file-inventory-pilot.jsonl --output data/vhsvault-program-catalog.jsonl --review-output data/vhsvault-program-review-queue.jsonl

      - name: Install image preview and local AI dependencies
        run: |
          python -m pip install Pillow transformers safetensors
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Enrich catalog with artwork candidates and optional TMDB metadata
        env:
          TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
        run: |
          python scripts/enrich_metadata_artwork.py \
            --input data/vhsvault-file-inventory-pilot.jsonl \
            --output data/vhsvault-metadata-artwork.jsonl

      - name: Build visual VHS artwork contact sheet
        run: |
          python scripts/build_artwork_contact_sheet.py \
            --input data/vhsvault-metadata-artwork.jsonl \
            --output-dir data/artwork-review \
            --limit 40

      - name: Classify artwork previews with local AI (review-only)
        run: |
          python scripts/classify_artwork_ai.py \
            --manifest data/artwork-review/vhs-artwork-review-manifest.json \
            --output data/artwork-review/vhs-artwork-ai-review-manifest.json \
            --limit 40

      - name: Evaluate AI suggestions against the manually reviewed pilot set
        run: |
          python scripts/evaluate_artwork_ai.py \
            --manifest data/artwork-review/vhs-artwork-ai-review-manifest.json \
            --labels tests/fixtures/artwork_ground_truth_sample.jsonl \
            --output data/artwork-review/ai-evaluation.json

      - name: Run program assembly and catalog tests
        run: |
          python -m py_compile scripts/build_program_catalog.py scripts/enrich_metadata_artwork.py scripts/build_artwork_contact_sheet.py scripts/classify_artwork_ai.py scripts/evaluate_artwork_ai.py
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Upload pilot results
        uses: actions/upload-artifact@v4
        with:
          name: vhs-fever-file-inventory-pilot
          path: |
            data/vhsvault-file-inventory-pilot.jsonl
            data/vhsvault-file-inventory-pilot.summary.json
            data/vhsvault-program-candidates.jsonl
            data/vhsvault-program-candidates.summary.json
            data/vhsvault-program-catalog.jsonl
            data/vhsvault-program-catalog.summary.json
            data/vhsvault-program-review-queue.jsonl
            data/vhsvault-metadata-artwork.jsonl
            data/vhsvault-metadata-artwork.summary.json
            data/artwork-review/vhs-artwork-contact-sheet.jpg
            data/artwork-review/vhs-artwork-review-manifest.json
            data/artwork-review/vhs-artwork-ai-review-manifest.json
            data/artwork-review/ai-evaluation.json
          if-no-files-found: error
          retention-days: 30
