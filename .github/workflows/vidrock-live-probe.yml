name: Temporary VidRock live probe

on:
  push:
    branches: [tmp/vidrock-live-probe-20261128]
    paths:
      - '.github/workflows/vidrock-live-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe VidRock API and media delivery
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_REF: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import base64, json, os, re, time, urllib.request, urllib.error, subprocess
          from urllib.parse import urljoin
          KEY = bytes.fromhex("7f3e9c2a8b5d1f4e6a9c3b7d2e5f8a1c4b6d9e2f5a8c1b4d7e9f2a5c8b1d4e7f")
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          H = {"User-Agent":UA,"Accept":"*/*","Origin":"https://vidrock.to","Referer":"https://vidrock.to/"}
          def get(url, headers=None, timeout=15):
              req=urllib.request.Request(url, headers=headers or H)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.status, r.headers.get("Content-Type",""), r.read(2_000_000), r.geturl()
              except urllib.error.HTTPError as e:
                  return e.code, e.headers.get("Content-Type",""), e.read(2000), url
          def decrypt(token):
              from cryptography.hazmat.primitives.ciphers.aead import AESGCM
              raw=base64.urlsafe_b64decode(token + "="*((4-len(token)%4)%4))
              return AESGCM(KEY).decrypt(raw[:12], raw[12:], None).decode()
          tests=[("Fight Club","movie/550"),("Inception","movie/27205"),("Breaking Bad S01E01","tv/1396/1/1"),("The Office S01E01","tv/2316/1/1")]
          out={"checked_at_utc":time.strftime("%Y-%m-%dT%H:%M:%SZ",time.gmtime()),"api_host":"vidrock.to","results":[]}
          for title,path in tests:
              item={"title":title,"api_path":path,"lanes":[]}
              status,ct,body,final=get("https://vidrock.to/api/"+path, {**H,"Accept":"application/json"})
              item["api_status"]=status
              if status==200:
                  try: lanes=json.loads(body)
                  except Exception as e: lanes={}; item["parse_error"]=str(e)
                  for name,entry in (lanes.items() if isinstance(lanes,dict) else []):
                      token=entry.get("url") if isinstance(entry,dict) else None
                      if not token: continue
                      lane={"name":name,"language":entry.get("language"),"type":entry.get("type")}
                      try:
                          u=decrypt(token); lane["decrypted_url"]=u
                          s,c,b,f=get(u,H)
                          lane.update({"stream_status":s,"content_type":c,"final_url":f,"bytes_read":len(b)})
                          txt=b.decode("utf-8","ignore").lstrip("\ufeff").strip()
                          if txt.startswith("#EXTM3U"):
                              lane["hls"]=True
                              lines=[x.strip() for x in txt.splitlines() if x.strip() and not x.startswith("#")]
                              if lines:
                                  nxt=urljoin(f,lines[0])
                                  if ".m3u8" in nxt.lower():
                                      vs,vc,vb,vf=get(nxt,H)
                                      lane["variant_status"]=vs; lane["variant_url"]=vf
                                      vt=vb.decode("utf-8","ignore").strip()
                                      segs=[x.strip() for x in vt.splitlines() if x.strip() and not x.startswith("#")]
                                      if segs:
                                          su=urljoin(vf,segs[0]); ss,sc,sb,sf=get(su,{**H,"Range":"bytes=0-65535"})
                                          lane.update({"segment_status":ss,"segment_url":sf,"segment_bytes":len(sb),"segment_content_type":sc})
                                  else:
                                      ss,sc,sb,sf=get(nxt,{**H,"Range":"bytes=0-65535"})
                                      lane.update({"segment_status":ss,"segment_url":sf,"segment_bytes":len(sb),"segment_content_type":sc})
                          else:
                              lane["hls"]=False
                              lane["body_prefix_hex"]=b[:16].hex()
                          lane["playable_candidate"]=False
                          if lane.get("hls") and lane.get("stream_status")==200:
                              hdr="User-Agent: "+UA+"\\r\\nReferer: https://vidrock.to/\\r\\nOrigin: https://vidrock.to\\r\\n"
                              try:
                                  p=subprocess.run(["ffmpeg","-nostdin","-v","error","-headers",hdr,"-i",u,"-frames:v","1","-f","image2pipe","-vcodec","mjpeg","pipe:1"],capture_output=True,timeout=35)
                                  lane["ffmpeg_exit"]=p.returncode
                                  lane["decoded_frame_bytes"]=len(p.stdout)
                                  lane["decoded_frame"]=p.returncode==0 and len(p.stdout)>1000
                                  lane["playable_candidate"]=lane["decoded_frame"]
                              except Exception as e: lane["ffmpeg_error"]=str(e)
                      except Exception as e: lane["decrypt_or_probe_error"]=str(e)
                      item["lanes"].append(lane)
              out["results"].append(item)
          print(json.dumps(out,indent=2))
          raw=json.dumps(out,indent=2).encode()
          api="https://api.github.com/repos/"+os.environ["GH_REPOSITORY"]+"/contents/vidrock-live-probe-result.json"
          payload={"message":"Add temporary VidRock probe result","content":base64.b64encode(raw).decode(),"branch":os.environ["GH_REF"]}
          req=urllib.request.Request(api,data=json.dumps(payload).encode(),headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"},method="PUT")
          with urllib.request.urlopen(req,timeout=20) as r: print("RESULT_FILE_COMMIT",r.status)
          PY
