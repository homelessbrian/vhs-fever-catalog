name: VHS Vault discovery

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Maximum pages to fetch in this run"
        required: true
        default: "1"
      resume:
        description: "Resume from the previous saved import state"
        type: boolean
        required: true
        default: false

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore previous import state
        if: inputs.resume
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          gh release download vhsvault-import-state \
            --pattern "vhsvault-import-state.tar.gz" \
            --dir data
          tar -xzf data/vhsvault-import-state.tar.gz -C data
          rm data/vhsvault-import-state.tar.gz

      - name: Run VHS Vault discovery
        run: |
          if [ "${{ inputs.resume }}" = "true" ]; then
            python scripts/discover_vhsvault.py --all --resume
          else
            python scripts/discover_vhsvault.py --max-pages "${{ inputs.max_pages }}"
          fi

      - name: Save import state to GitHub Release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f data/vhsvault-discovery.jsonl ]; then
            tar -czf data/vhsvault-import-state.tar.gz \
              -C data vhsvault-discovery.jsonl \
              $( [ -f data/vhsvault-discovery.checkpoint.json ] && echo vhsvault-discovery.checkpoint.json ) \
              $( [ -f data/vhsvault-discovery.summary.json ] && echo vhsvault-discovery.summary.json )
            if ! gh release view vhsvault-import-state >/dev/null 2>&1; then
              gh release create vhsvault-import-state \
                --title "VHS Vault import state" \
                --notes "Persistent working state for the resumable VHS Vault metadata import." \
                --prerelease
            fi
            gh release upload vhsvault-import-state \
              data/vhsvault-import-state.tar.gz --clobber
          else
            echo "No discovery data exists yet; nothing to persist."
          fi
