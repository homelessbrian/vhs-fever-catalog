name: Enrichment artwork policy tests

on:
  push:
    paths:
      - "scripts/validate_enrichment.py"
      - "schemas/enrichment-record.schema.json"
      - "tests/test_validate_enrichment_artwork_policy.py"
      - ".github/workflows/enrichment-artwork-policy.yml"
  pull_request:
    paths:
      - "scripts/validate_enrichment.py"
      - "schemas/enrichment-record.schema.json"
      - "tests/test_validate_enrichment_artwork_policy.py"
      - ".github/workflows/enrichment-artwork-policy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artwork-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run artwork storage policy tests
        run: python -m unittest discover -s tests -p "test_validate_enrichment_artwork_policy.py" -v
