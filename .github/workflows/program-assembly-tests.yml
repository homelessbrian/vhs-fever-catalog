name: Program assembly tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile catalog scripts
        run: python -m py_compile scripts/build_program_candidates.py scripts/build_program_catalog.py scripts/inspect_file_inventory.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
