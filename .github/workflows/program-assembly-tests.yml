name: Program assembly tests

on:
  push:
    paths:
      - "scripts/build_program_candidates.py"
      - "tests/**"
      - ".github/workflows/program-assembly-tests.yml"
  pull_request:
    paths:
      - "scripts/build_program_candidates.py"
      - "tests/**"
      - ".github/workflows/program-assembly-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
