<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VHS FEVER · Program Review</title><style>
:root{color-scheme:dark;--bg:#11100f;--p:#1d1a18;--line:#39332d;--muted:#aaa096;--red:#e34d42;--gold:#e6b86b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5eee4;font:15px/1.5 system-ui}header,main{padding:20px clamp(14px,3vw,40px)}header{border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:19px;letter-spacing:.12em;margin:0}main{max-width:1500px;margin:auto}.bar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}input,select,textarea,button{font:inherit;color:inherit;background:var(--p);border:1px solid var(--line);border-radius:8px;padding:10px}input{flex:1;min-width:220px}button{cursor:pointer}button.active,button:hover{border-color:var(--gold)}.layout{display:grid;grid-template-columns:minmax(250px,350px) minmax(0,1fr);gap:15px}.list,.detail{background:var(--p);border:1px solid var(--line);border-radius:11px;overflow:hidden}.list{max-height:78vh;overflow:auto}.item{padding:12px;border-bottom:1px solid var(--line);cursor:pointer}.item:hover,.item.active{background:#302720}.item b{display:block}.muted,small{color:var(--muted);font-size:12px}.detail{padding:18px}.player{width:100%;aspect-ratio:16/9;background:#050505;border-radius:8px;max-height:65vh}.section{border-top:1px solid var(--line);margin-top:18px;padding-top:14px}.section h3{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--gold)}.artgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:10px}.art{background:#292521;padding:8px;border-radius:8px}.art img{width:100%;height:190px;object-fit:contain;background:#111}.art small{display:block;overflow-wrap:anywhere}.note{width:100%;min-height:70px}a{color:#e9c58f}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:800px){.layout{grid-template-columns:1fr}.list{max-height:34vh}}
</style></head><body><header><div><h1>VHS FEVER · PROGRAM REVIEW</h1><div class="muted">Watch the source · Compare artwork · Make the call</div></div><a href="./">← Archive Research Desk</a></header><main><div class="bar"><input id="q" type="search" placeholder="Search titles or Archive IDs"><select id="filter"><option value="all">All programs</option><option value="todo">Needs review</option><option value="multi">Multi-part suggestions</option></select><button id="reload">↻ Refresh</button><button id="export">Export decisions</button></div><div class="muted" id="status">Loading catalog…</div><div class="layout"><div class="list" id="list"></div><section class="detail" id="detail">Choose a program to inspect.</section></div></main><script>
const $=x=>document.getElementById(x);let rows=[],archives=new Map(),selected=null,decisions={};try{decisions=JSON.parse(localStorage.getItem("vhsfever-decisions")||"{}")}catch{}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const parse=t=>t.split(/\r?\n/).filter(Boolean).map(JSON.parse);
const fileUrl=(id,n)=>"https://archive.org/download/"+encodeURIComponent(id)+"/"+String(n).split("/").map(encodeURIComponent).join("/");
async function load(){ $("reload").disabled=true;$("status").textContent="Fetching published feeds…";try{const base="https://raw.githubusercontent.com/homelessbrian/vhs-fever-catalog/catalog-data/";const [a,b]=await Promise.all([fetch(base+"programs.jsonl?"+Date.now()),fetch(base+"latest.jsonl?"+Date.now())]);if(!a.ok)throw Error("program feed HTTP "+a.status);if(!b.ok)throw Error("source feed HTTP "+b.status);rows=parse(await a.text());archives=new Map(parse(await b.text()).map(x=>[x.identifier,x]));$("status").textContent=rows.length+" program entries loaded · "+archives.size+" Archive records";render()}catch(e){$("status").textContent="Feed unavailable: "+e.message}finally{$("reload").disabled=false}}
function render(){const q=$("q").value.toLowerCase(),f=$("filter").value;const shown=rows.filter(p=>{const d=decisions[p.program_id]||{};return (!q||(p.title+" "+p.display_title+" "+p.program_id+" "+(p.segments||[]).map(s=>s.archive_identifier).join(" ")).toLowerCase().includes(q))&&(f==="all"||(f==="todo"&&(p.review_required||!d.status))||(f==="multi"&&p.entry_type==="assembled_candidate"))});$("list").innerHTML=shown.map(p=>'<div class="item '+(p.program_id===selected?'active':'')+'" data-id="'+esc(p.program_id)+'"><b>'+esc(p.title||"Untitled")+'</b><small>'+esc(p.entry_type)+' · '+esc(p.total_known_duration_seconds?Math.round(p.total_known_duration_seconds/60)+" min":"runtime unknown")+'</small></div>').join("")||'<div class="item muted">No matching programs.</div>';document.querySelectorAll("[data-id]").forEach(el=>el.onclick=()=>{selected=el.dataset.id;render();detail()});if(selected&&shown.some(p=>p.program_id===selected))detail()}
function detail(){const p=rows.find(x=>x.program_id===selected);if(!p)return;const seg=p.segments||[],s=seg[0]||{},archive=archives.get(s.archive_identifier)||{},art=archive.vhs_fever_metadata_artwork?.artwork_candidates||[],tm=archive.vhs_fever_metadata_artwork?.tmdb||{},d=decisions[selected]||{};const player=seg.length===1?'<video class="player" controls playsinline preload="metadata" src="'+fileUrl(s.archive_identifier,s.file_name)+'"></video>':'<div class="muted">Multi-part suggestion — inspect each source segment below. Parts are not automatically stitched together.</div>';const parts=seg.map((x,i)=>'<p class="muted">Part '+(i+1)+': '+esc(x.file_name)+' · '+esc(x.duration_seconds?Math.round(x.duration_seconds/60)+" min":"runtime unknown")+' · <a target="_blank" rel="noopener" href="'+fileUrl(x.archive_identifier,x.file_name)+'">Open source</a></p>').join("");const artHtml=art.length?art.map(x=>'<div class="art"><a target="_blank" href="'+esc(x.asset_url)+'"><img loading="lazy" src="'+esc(x.asset_url)+'"></a><small>'+esc(x.candidate_role)+'<br>'+esc(x.file_name)+'</small></div>').join(""):'<p class="muted">No VHS sleeve scans identified in the source item yet.</p>';const tmHtml=tm.tmdb_id?'<p><a target="_blank" href="'+esc(tm.tmdb_url)+'">'+esc(tm.title||"TMDB match")+'</a> · '+esc(tm.release_date||"")+'</p>':(tm.candidate_results||[]).map(x=>'<p>'+esc(x.title)+' · '+esc(x.release_date||"")+'</p>').join("")||'<p class="muted">No parent-item TMDB match. Individual program matching is a follow-up step.</p>';$("detail").innerHTML='<h2>'+esc(p.title||"Untitled program")+'</h2><div class="muted">'+esc(p.entry_type)+' · '+esc(p.assembly_status||"")+'</div><div style="margin:14px 0">'+player+'</div>'+parts+'<div class="section"><h3>Possible VHS packaging</h3><div class="artgrid">'+artHtml+'</div></div><div class="section"><h3>TMDB candidates</h3>'+tmHtml+'<small>TMDB poster art is not proof of the original VHS edition.</small></div><div class="section"><h3>Review decision</h3><div class="actions">'+["keep","investigate","reject"].map(x=>'<button data-choice="'+x+'" class="'+(d.status===x?'active':'')+'">'+({keep:"✓ Keep",investigate:"? Investigate",reject:"✕ Reject"}[x])+'</button>').join("")+'</div><textarea class="note" id="notes" placeholder="Notes…">'+esc(d.notes||"")+'</textarea><small>Decisions are saved in this browser. Use Export decisions to back them up.</small></div>';document.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>save(b.dataset.choice));$("notes").onchange=()=>save(d.status||"investigate")}
function save(status){decisions[selected]={status,notes:$("notes").value,updated_at:new Date().toISOString()};localStorage.setItem("vhsfever-decisions",JSON.stringify(decisions));detail()}
$("reload").onclick=load;$("q").oninput=render;$("filter").onchange=render;$("export").onclick=()=>{const blob=new Blob([JSON.stringify(decisions,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="vhs-fever-review-decisions.json";a.click();URL.revokeObjectURL(url)};load();
</script></body></html>
