<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VHS FEVER · Catalog Review</title>
<style>
:root{--bg:#141210;--panel:#1d1a17;--panel2:#25211d;--line:#3a332c;--text:#efe6da;--muted:#a89a8a;--gold:#f0b23c;--red:#e2574c;--green:#6cc27a;--blue:#69a7e8;--violet:#b48be8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
a{color:var(--gold)}button,input,select,textarea{font:inherit;color:inherit}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);background:#100e0c;position:sticky;top:0;z-index:5}
.brand{display:flex;gap:10px;align-items:center}.mark{background:var(--gold);color:#1a1206;font-weight:900;padding:4px 7px;border-radius:4px;letter-spacing:1px}
h1{font-size:17px;margin:0}.sub{color:var(--muted);font-size:12px}
.layout{display:grid;grid-template-columns:360px 1fr;height:calc(100vh - 57px)}
.side{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.filters{padding:10px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
.filters input,.filters select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}.tab{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:5px 10px;font-size:12px;cursor:pointer}
.tab.on{background:var(--gold);color:#1a1206;border-color:var(--gold);font-weight:700}
.list{overflow:auto;flex:1}.row{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}.row:hover{background:var(--panel)}.row.on{background:var(--panel2);box-shadow:inset 3px 0 var(--gold)}
.row b{display:block}.row .m{font-size:12px;color:var(--muted)}
.main{overflow:auto;padding:18px 22px}
.level{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;font-weight:800;margin-bottom:4px}
.lv-title{color:var(--gold)}.lv-ed{color:var(--blue)}.lv-rec{color:var(--violet)}.lv-src{color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.ed{border-left:4px solid var(--blue)}.ed.dvd{border-left-color:#8a8a8a}.ed.unassigned{border-left-color:var(--red)}
.rec{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--violet);border-radius:9px;padding:11px;margin:9px 0}
.pill{display:inline-block;font-size:11px;border-radius:12px;padding:2px 8px;margin:2px 4px 2px 0;background:#2f2a24;color:#d6c8b8}
.pill.vhs{background:#1f3550;color:#a9d0ff}.pill.dvd{background:#3a3a3a}.pill.review{background:#4a2420;color:#ffb3aa}.pill.ok{background:#1f3d27;color:#a8e6b4}.pill.warn{background:#4a3a14;color:#ffd98a}
.cands{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.cand{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px;font-size:12px}.cand img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:5px;background:#000}
.cand.pick{outline:2px solid var(--green)}.cand.bad{opacity:.55}
.src{display:flex;justify-content:space-between;gap:10px;align-items:center;border-top:1px solid var(--line);padding:6px 0;font-size:12px}
.src code{overflow-wrap:anywhere;color:#e6d9c9}.src .r{white-space:nowrap}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px 10px;cursor:pointer;font-size:12px}.btn:hover{border-color:var(--gold)}.btn.on{background:var(--gold);color:#1a1206;font-weight:700}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
textarea{width:100%;min-height:52px;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px;margin-top:6px}
.art{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.art a{font-size:11px;text-align:center;color:var(--muted)}.art img{display:block;width:96px;height:132px;object-fit:contain;background:#000;border:1px solid var(--line);border-radius:5px}
video{width:100%;max-height:60vh;background:#000;border-radius:9px;margin-top:8px}
.player{position:sticky;top:0;z-index:3;background:var(--bg);padding-bottom:6px}
.note{color:var(--muted);font-size:12px}.empty{padding:30px;color:var(--muted);text-align:center}
.stats{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
details>summary{cursor:pointer;list-style:none}details>summary::-webkit-details-marker{display:none}
@media(max-width:820px){.layout{grid-template-columns:1fr;height:auto}.side{max-height:46vh}.main{padding:12px}}
</style>
</head>
<body>
<header><div class="brand"><div class="mark">VHS</div><div><h1>VHS FEVER</h1><div class="sub">Catalog review · Movie → Release → Recording → File</div></div></div>
<div class="actions"><button class="btn" id="export">Export decisions</button><label class="btn">Import<input type="file" id="import" accept="application/json" hidden></label></div></header>
<div class="layout">
<aside class="side">
 <div class="filters">
  <input id="q" type="search" placeholder="Search movies, filenames, Archive IDs…">
  <div class="tabs" id="tabs"></div>
  <select id="tm"><option value="">Any TMDB status</option><option value="one_likely_candidate">One likely TMDB match</option><option value="several_candidates">Several TMDB candidates</option><option value="weak_candidates_only">Weak candidates only</option><option value="no_candidates">No TMDB candidates</option><option value="reviewed">Reviewed by me</option><option value="unreviewed">Not reviewed yet</option></select>
  <div class="stats" id="stats">Loading…</div>
 </div>
 <div class="list" id="list"></div>
</aside>
<main class="main" id="main"><div class="empty">Pick a movie on the left.</div></main>
</div>
<script>
const FEED=new URLSearchParams(location.search).get("feed")||"https://raw.githubusercontent.com/homelessbrian/vhs-fever-catalog/catalog-model-data/reviewer-feed.json";
const SHELVES=[["","All"],["vhs_release","VHS releases"],["other_media_release","Other media"],["vhs_opening_or_previews","Openings & previews"],["manual_review","Manual review"]];
const SHELF_LABEL={vhs_release:"VHS release",other_media_release:"Other media",vhs_opening_or_previews:"Opening / previews",manual_review:"Manual review"};
const KEY="vhsfever-catalog-decisions-v1";
let data=null,shelf="",sel=null,decisions={};
try{decisions=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){decisions={}}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mins=s=>s?Math.round(s/60)+" min":"length unknown";
function save(){try{localStorage.setItem(KEY,JSON.stringify(decisions))}catch(e){}}
function dec(level,id){return decisions[level+":"+id]||{}}
function setDec(level,id,patch){const k=level+":"+id;decisions[k]={...(decisions[k]||{}),...patch,level,id,updated_at:new Date().toISOString()};save()}
function titleReviewed(t){return !!(dec("title",t.id).status)}

async function load(){
 try{const r=await fetch(FEED+(FEED.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);data=await r.json()}
 catch(e){$("stats").textContent="Could not load the catalog feed: "+e.message;return}
 $("tabs").innerHTML=SHELVES.map(([k,l])=>'<span class="tab'+(k===shelf?" on":"")+'" data-k="'+k+'">'+esc(l)+' <small>'+count(k)+'</small></span>').join("");
 document.querySelectorAll(".tab").forEach(el=>el.onclick=()=>{shelf=el.dataset.k;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===el));renderList()});
 const s=data.summary;$("stats").innerHTML=esc(data.titles.length)+" movies/programs · "+esc(s.recordings)+" recordings · "+esc(s.video_files)+" files · built "+esc(data.generated_at.slice(0,16).replace("T"," "));
 const hash=decodeURIComponent(location.hash.slice(1));if(hash&&data.titles.some(t=>t.id===hash))sel=hash;
 renderList();if(sel)renderTitle();
}
function count(k){return k?data.titles.filter(t=>t.cats.includes(k)).length:data.titles.length}
function filtered(){
 const q=$("q").value.trim().toLowerCase(),tm=$("tm").value;
 return data.titles.filter(t=>{
  if(shelf&&!t.cats.includes(shelf))return false;
  if(tm==="reviewed"&&!titleReviewed(t))return false;
  if(tm==="unreviewed"&&titleReviewed(t))return false;
  if(tm&&!["reviewed","unreviewed"].includes(tm)&&t.tmdb.status!==tm)return false;
  if(!q)return true;
  if(t.t.toLowerCase().includes(q))return true;
  const recs=[...t.eds.flatMap(e=>e.recs),...t.un];
  return recs.some(r=>r.name.toLowerCase().includes(q)||r.items.some(i=>i.toLowerCase().includes(q)));
 });
}
function renderList(){
 const rows=filtered().slice(0,600);
 $("list").innerHTML=rows.length?rows.map(t=>{
  const d=dec("title",t.id),vhs=t.eds.filter(e=>e.media==="VHS").length,other=t.eds.length-vhs;
  return '<div class="row'+(t.id===sel?" on":"")+'" data-id="'+esc(t.id)+'"><b>'+esc(t.t)+'</b><div class="m">'+
  (vhs?vhs+" VHS release"+(vhs>1?"s":"")+" · ":"")+(other?other+" other release"+(other>1?"s":"")+" · ":"")+
  t.nrec+" recording"+(t.nrec>1?"s":"")+(t.un.length?" · "+t.un.length+" unplaced":"")+
  (d.status?' · <span class="pill ok">'+esc(d.status.replace(/_/g," "))+'</span>':"")+'</div></div>'}).join("")+(filtered().length>600?'<div class="empty">Showing first 600 — search to narrow.</div>':""):'<div class="empty">Nothing matches.</div>';
 document.querySelectorAll(".row").forEach(el=>el.onclick=()=>{sel=el.dataset.id;location.hash=encodeURIComponent(sel);renderList();renderTitle()});
}
function catPill(c){return '<span class="pill '+(c==="vhs_release"?"vhs":c==="manual_review"?"review":c==="other_media_release"?"dvd":"warn")+'">'+esc(SHELF_LABEL[c]||c)+'</span>'}

function renderTitle(){
 const t=data.titles.find(x=>x.id===sel);if(!t)return;const d=dec("title",t.id);
 const cands=t.tmdb.c||[];
 let h='<div class="player" id="player"></div>';
 h+='<div class="card"><div class="level lv-title">Movie / program</div><h2 style="margin:0 0 4px">'+esc(t.t)+'</h2>'+
  '<div class="note">'+(t.series?"TV series episode · ":"")+(t.years.length?"Film year written in filename: "+esc(t.years.join(", "))+" · ":"")+
  'TMDB: '+esc((t.tmdb.status||"not searched").replace(/_/g," "))+(t.tmdb.ceiling?' · earliest tape/disc year '+esc(t.tmdb.ceiling)+' (film can’t be newer)':"")+'</div>'+
  (t.similar.length?'<div class="note">⚠ Similar spelling to: '+t.similar.map(id=>{const o=data.titles.find(x=>x.id===id);return o?'<a href="#'+esc(id)+'" data-jump="'+esc(id)+'">'+esc(o.t)+'</a>':""}).join(", ")+' — possible typo</div>':"");
 if(cands.length){h+='<div class="cands">'+cands.map(c=>'<div class="cand'+(d.tmdb_id===c.tmdb_id?" pick":"")+(c.year_consistent===false?" bad":"")+'">'+
  (c.poster?'<img loading="lazy" src="'+esc(c.poster)+'" alt="">':"")+'<b>'+esc(c.title)+'</b><br>'+esc((c.release_date||"—").slice(0,4))+' · '+esc(c.media_type)+
  '<br>match '+Math.round((c.similarity||0)*100)+'%'+(c.year_consistent===false?' · <span style="color:var(--red)">too new for this tape</span>':"")+
  '<div class="actions"><button class="btn'+(d.tmdb_id===c.tmdb_id?" on":"")+'" data-pick="'+c.tmdb_id+'">This is it</button><a class="btn" href="'+esc(c.tmdb_url)+'" target="_blank" rel="noopener">TMDB ↗</a></div></div>').join("")+'</div>'}
 h+='<div class="note" style="margin-top:8px">TMDB posters are movie-level art, not VHS packaging.</div>'+
  '<div class="actions"><button class="btn'+(d.status==="identity_confirmed"?" on":"")+'" data-tstatus="identity_confirmed">✓ Identity confirmed</button><button class="btn'+(d.status==="no_tmdb_match"?" on":"")+'" data-tstatus="no_tmdb_match">No TMDB match</button><button class="btn'+(d.status==="needs_more_research"?" on":"")+'" data-tstatus="needs_more_research">? Needs research</button><button class="btn'+(d.status==="not_catalog_material"?" on":"")+'" data-tstatus="not_catalog_material">✕ Not catalog material</button></div>'+
  '<textarea data-note="title:'+esc(t.id)+'" placeholder="Notes about this movie/program">'+esc(d.notes||"")+'</textarea></div>';
 for(const e of t.eds)h+=renderEdition(e);
 if(t.un.length)h+='<div class="card ed unassigned"><div class="level lv-ed">Not placed in a release</div><div class="note">The filename doesn’t say the format and year, so these aren’t grouped into a release yet. Nothing has been removed.</div>'+t.un.map(renderRec).join("")+'</div>';
 $("main").innerHTML=h;$("main").scrollTop=0;wire(t);
}
function renderEdition(e){
 const d=dec("edition",e.id),isVhs=e.media==="VHS";
 const art=e.recs.flatMap(r=>r.art);
 return '<details class="card ed'+(isVhs?"":" dvd")+'" open><summary><div class="level lv-ed">Release</div><h3 style="margin:0">'+esc(e.media.replace("_"," "))+' · '+esc(e.year)+'</h3>'+
  '<div class="note">'+e.recs.length+' recording'+(e.recs.length>1?"s":"")+(e.notes.length?' · copy notes seen: '+esc(e.notes.join("; ")):"")+(isVhs?"":' · <b>not VHS</b>')+(d.status?' · <span class="pill ok">'+esc(d.status.replace(/_/g," "))+'</span>':"")+'</div></summary>'+
  (art.length?'<div class="level lv-ed" style="margin-top:10px">Packaging from the Archive</div><div class="art">'+art.map(a=>'<a href="'+esc(a.url)+'" target="_blank" rel="noopener"><img loading="lazy" src="'+esc(a.url)+'" alt="">'+esc(a.role.replace("vhs_",""))+'</a>').join("")+'</div>':'<div class="note" style="margin-top:8px">No packaging scans found for this release.</div>')+
  '<div class="actions"><button class="btn'+(d.status==="release_confirmed"?" on":"")+'" data-estatus="release_confirmed" data-eid="'+esc(e.id)+'">✓ Release confirmed</button><button class="btn'+(d.status==="wrong_format"?" on":"")+'" data-estatus="wrong_format" data-eid="'+esc(e.id)+'">Wrong format</button><button class="btn'+(d.status==="split_into_separate_releases"?" on":"")+'" data-estatus="split_into_separate_releases" data-eid="'+esc(e.id)+'">These are different releases</button></div>'+
  '<textarea data-note="edition:'+esc(e.id)+'" placeholder="Release notes (distributor, clamshell, region…)">'+esc(d.notes||"")+'</textarea>'+
  e.recs.map(renderRec).join("")+'</details>';
}
function renderRec(r){
 const d=dec("recording",r.id);
 const flags=[...r.why.map(w=>'<span class="pill review">'+esc(w)+'</span>'),...r.flags.filter(f=>!["no_media_format_in_filename"].includes(f)).map(f=>'<span class="pill warn">'+esc(f.replace(/_/g," "))+'</span>')].join("");
 const order=x=>x.role==="archive_derivative"?1:0;
 return '<details class="rec"><summary><div class="level lv-rec">Recording'+(r.ver?' · labelled “Version '+esc(r.ver)+'”':"")+(r.parts>1?' · '+r.parts+' parts':"")+'</div>'+
 '<b style="overflow-wrap:anywhere">'+esc(r.name)+'</b><div class="note">'+mins(r.dur)+' · '+catPill(r.cat)+' · Archive: '+r.items.map(i=>'<a href="https://archive.org/details/'+encodeURIComponent(i)+'" target="_blank" rel="noopener">'+esc(i)+'</a>').join(", ")+
 (r.ident==="md5"?' · identical-file check by checksum':"")+(r.also.length>1?'<br>Same bytes also named: '+r.also.map(esc).join(" · "):"")+'</div>'+(flags?'<div>'+flags+'</div>':"")+'<div class="note" style="margin-top:4px">▸ '+(d.status?'<span class="pill ok">'+esc(d.status.replace(/_/g," "))+'</span> ':"")+'Show '+r.segs.reduce((n,s)=>n+s.src.length,0)+' file(s), play & review</div></summary>'+
 r.segs.map(s=>(r.parts>1?'<div class="note" style="margin-top:6px">Part '+s.o+' · '+mins(s.dur)+'</div>':"")+[...s.src].sort((a,b)=>order(a)-order(b)).map(x=>'<div class="src"><div><span class="level lv-src">'+(x.role==="archive_derivative"?"Archive copy":"Uploaded file")+'</span><br><code>'+esc(x.n)+'</code><div class="note">'+esc(x.fmt||"format unknown")+' · '+mins(x.dur)+'</div></div><div class="r">'+
  (x.play?'<button class="btn" data-play="'+esc(x.url)+'" data-label="'+esc(x.n)+'">▶ Play</button> ':"")+'<a class="btn" href="'+esc(x.url)+'" target="_blank" rel="noopener">File ↗</a></div></div>').join("")).join("")+
 '<div class="actions"><button class="btn'+(d.status==="good"?" on":"")+'" data-rstatus="good" data-rid="'+esc(r.id)+'">✓ Good copy</button><button class="btn'+(d.status==="same_as_another"?" on":"")+'" data-rstatus="same_as_another" data-rid="'+esc(r.id)+'">Same recording as another</button><button class="btn'+(d.status==="wrong_release"?" on":"")+'" data-rstatus="wrong_release" data-rid="'+esc(r.id)+'">Wrong release</button><button class="btn'+(d.status==="has_extra_content"?" on":"")+'" data-rstatus="has_extra_content" data-rid="'+esc(r.id)+'">Has trailers/extra programs</button><button class="btn'+(d.status==="bad_or_broken"?" on":"")+'" data-rstatus="bad_or_broken" data-rid="'+esc(r.id)+'">Bad / broken</button></div>'+
 '<textarea data-note="recording:'+esc(r.id)+'" placeholder="Notes (timestamps of programs/commercials, quality…)">'+esc(d.notes||"")+'</textarea></details>';
}
function wire(t){
 document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{const id=+b.dataset.pick,cur=dec("title",t.id).tmdb_id;setDec("title",t.id,{tmdb_id:cur===id?null:id,display_title:t.t});renderTitle();renderList()});
 document.querySelectorAll("[data-tstatus]").forEach(b=>b.onclick=()=>{setDec("title",t.id,{status:b.dataset.tstatus,display_title:t.t});renderTitle();renderList()});
 document.querySelectorAll("[data-estatus]").forEach(b=>b.onclick=()=>{setDec("edition",b.dataset.eid,{status:b.dataset.estatus,title_id:t.id});renderTitle()});
 document.querySelectorAll("[data-rstatus]").forEach(b=>b.onclick=()=>{setDec("recording",b.dataset.rid,{status:b.dataset.rstatus,title_id:t.id});renderTitle()});
 document.querySelectorAll("[data-note]").forEach(a=>a.onchange=()=>{const[l,id]=a.dataset.note.split(/:(.+)/);setDec(l,id,{notes:a.value,title_id:t.id})});
 document.querySelectorAll("[data-jump]").forEach(a=>a.onclick=ev=>{ev.preventDefault();sel=a.dataset.jump;location.hash=encodeURIComponent(sel);renderList();renderTitle()});
 document.querySelectorAll("[data-play]").forEach(b=>b.onclick=()=>{$("player").innerHTML='<div class="card" style="margin-top:0"><div class="level lv-src">Now playing</div><code style="overflow-wrap:anywhere">'+esc(b.dataset.label)+'</code> <button class="btn" id="closeplayer">Close</button><video controls autoplay preload="metadata" src="'+esc(b.dataset.play)+'"></video></div>';$("closeplayer").onclick=()=>$("player").innerHTML="";$("main").scrollTop=0});
}
$("q").oninput=renderList;$("tm").onchange=renderList;
$("export").onclick=()=>{const blob=new Blob([JSON.stringify({schema:"vhsfever-review-decisions-v1",exported_at:new Date().toISOString(),decisions:Object.values(decisions)},null,1)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="vhsfever-review-decisions.json";a.click()};
$("import").onchange=async ev=>{const f=ev.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());for(const d of j.decisions||[])decisions[d.level+":"+d.id]=d;save();renderList();if(sel)renderTitle()}catch(e){alert("Could not read that file")}};
window.onhashchange=()=>{const h=decodeURIComponent(location.hash.slice(1));if(data&&h&&h!==sel&&data.titles.some(t=>t.id===h)){sel=h;renderList();renderTitle()}};
load();
</script>
</body>
</html>
